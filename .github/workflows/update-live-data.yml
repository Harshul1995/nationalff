name: Update Instagram feed
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instagram
        run: node scripts/fetch-instagram.mjs
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
      - name: Commit if changed
        run: |
          git config user.name "live-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update Instagram feed" && git push)
